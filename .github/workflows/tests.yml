name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BrimView-widgets/pyproject.toml

      - name: Install dependencies
        working-directory: BrimView-widgets
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[processing,statistics,remote-store]" pytest

      - name: Run tests
        working-directory: BrimView-widgets
        run: pytest
